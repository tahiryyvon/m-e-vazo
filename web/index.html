<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="M'e-Vazo : lecteur musical avec paroles synchronisées et accords de guitare.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="M'e-Vazo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>M'e-Vazo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    /* Phones: the installed app is already fullscreen (manifest) and the
       button would cover the player controls. */
    @media (max-width: 699px) { #fullscreen { display: none; } }
  </style>
  <button id="fullscreen" type="button" aria-label="Passer en plein écran"
    style="position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom, 0px) + 84px);z-index:10000;border:1px solid #ff8c00;border-radius:8px;padding:6px 10px;font:12px sans-serif;background:rgba(24,24,24,.85);color:white;cursor:pointer;opacity:.8">
    Plein écran
  </button>
  <script>
    const fullscreenButton = document.getElementById('fullscreen');
    const installedFullscreen = window.matchMedia('(display-mode: fullscreen)');
    function updateFullscreenButton() {
      fullscreenButton.hidden = Boolean(document.fullscreenElement) || installedFullscreen.matches;
    }
    fullscreenButton.addEventListener('click', async () => {
      if (!document.documentElement.requestFullscreen) {
        fullscreenButton.textContent = 'Plein écran indisponible sur ce navigateur';
        return;
      }
      try {
        await document.documentElement.requestFullscreen();
      } catch (_) {
        fullscreenButton.textContent = 'Réessayer le plein écran';
      }
    });
    document.addEventListener('fullscreenchange', updateFullscreenButton);
    installedFullscreen.addEventListener('change', updateFullscreenButton);
    updateFullscreenButton();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
